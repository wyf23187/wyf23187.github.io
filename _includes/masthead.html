<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item">
            <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="
              background: none;
              border: none;
              cursor: pointer;
              font-size: 1.2em;
              padding: 0.5em 0.8em;
              color: var(--text-primary);
              transition: all 0.3s ease;
              border-radius: 50%;
              display: inline-flex;
              align-items: center;
              justify-content: center;
            " onmouseover="this.style.backgroundColor='var(--bg-secondary)'" onmouseout="this.style.backgroundColor='transparent'">
              <i class="fas fa-moon"></i>
            </button>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
